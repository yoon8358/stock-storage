name: Update INDEX.md

on:
  push:
    branches: [main]
    paths-ignore:
      - "INDEX.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate INDEX.md
        run: python3 generate_index.py
      - name: Commit if changed
        run: |
          git config user.name "index-bot"
          git config user.email "index-bot@users.noreply.github.com"
          git add INDEX.md
          git diff --cached --quiet || git commit -m "chore: update INDEX.md"
          git push origin HEAD:main
